name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pack extension
        run: |
          zip -r "windbar@mikanight.shell-extension.zip" \
            metadata.json \
            extension.js \
            prefs.js \
            cli.js \
            parser.js \
            windbar-connected.svg \
            windbar-disconnected.svg \
            schemas/

      - name: Upload release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: windbar@mikanight.shell-extension.zip
